<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Hub</title>
<meta name="description" content="Algebra 1 in 7 days and Business Ch. 1-7 exam prep in one app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2347c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Hub">
<style>body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one study column on graph paper. Dashboard → day session (6 stages) → skill page (worked → faded → gated practice). */
:root{
  --paper:#f7f9fc; --grid:rgba(40,80,170,.07); --card:#ffffff; --ink:#152033; --ink-2:#4b5a70; --line:#d6dde8;
  --accent:#2347c2; --accent-soft:#e7edfc; --on-accent:#ffffff; --accent-2:#c2410c;
  --hl:#ffe27a; --hl-ink:#2e2400;
  --good:#11765a; --good-soft:#e0f3ea; --bad:#bf3328; --bad-soft:#fbe8e6; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-math:"STIX Two Math","Cambria Math","Latin Modern Math",math,serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e131b; --grid:rgba(140,170,255,.05); --card:#151c27; --ink:#e6ebf3; --ink-2:#a2aec0; --line:#2a3446;
  --accent:#8aa8ff; --accent-soft:#1d2948; --on-accent:#0e131b; --accent-2:#ff9b5e;
  --hl:rgba(255,226,122,.24); --hl-ink:#ffeaa8;
  --good:#52d3a3; --good-soft:#11302a; --bad:#ff8c82; --bad-soft:#3a1b1b; --warn:#ffcf70; --warn-soft:#3a2e12; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e131b; --grid:rgba(140,170,255,.05); --card:#151c27; --ink:#e6ebf3; --ink-2:#a2aec0; --line:#2a3446;
  --accent:#8aa8ff; --accent-soft:#1d2948; --on-accent:#0e131b; --accent-2:#ff9b5e;
  --hl:rgba(255,226,122,.24); --hl-ink:#ffeaa8;
  --good:#52d3a3; --good-soft:#11302a; --bad:#ff8c82; --bad-soft:#3a1b1b; --warn:#ffcf70; --warn-soft:#3a2e12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,2.7rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:750}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
ul,ol{margin:0}
.muted{color:var(--ink-2)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink-2);display:block}
math{font-family:var(--f-math);font-size:1.1em}
.katex-display,math[display="block"]{margin:.3em 0;overflow-x:auto;overflow-y:hidden}
code{font-size:.9em;background:var(--accent-soft);padding:0 .3em;border-radius:4px;word-break:break-word}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button[disabled]{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:.4em;border:0;border-radius:999px;padding:.58em 1.15em;font-weight:700;background:var(--accent);color:var(--on-accent);text-decoration:none;line-height:1.2}
.btn:hover:not([disabled]){filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.quiet{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:.4em .9em;font-size:.9rem}
.btn[disabled]{opacity:.45}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.card ul{padding-left:1.1em;display:grid;gap:6px}
.pill{font-size:.76rem;font-weight:700;padding:.2em .7em;border-radius:99px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.linkish{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:0}
.scroll{overflow-x:auto}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:.5em;text-decoration:none;color:var(--ink)}
.brand .sq{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-family:Georgia,serif;font-style:italic}
.navl{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem;font-weight:700}
.navl a{text-decoration:none}
body.noref .refl{display:none}

.hero{display:grid;gap:14px;margin-bottom:22px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;min-width:0}
.kpis b{font-family:var(--f-display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpis span{font-size:.78rem;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start}
.day.cur{border:2px solid var(--accent)}
.day.locked{opacity:.62}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sk{display:grid;gap:5px}
.skr{display:grid;grid-template-columns:1fr 64px 38px;gap:8px;align-items:center;font-size:.84rem}
.skr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--ink-2);text-align:right}
.meter{display:block;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.meter.sm{height:6px}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.dmeta{font-size:.82rem;color:var(--ink-2)}
.final{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:center;padding:16px;border-radius:var(--r);background:var(--accent-soft)}
.foot{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:.84rem;color:var(--ink-2)}

.dayhead{display:grid;gap:6px;margin-bottom:16px}
.stages{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stage{width:100%;height:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stage b{display:block;font-size:.95rem}
.stage small{display:block;color:var(--ink-2);font-size:.78rem;line-height:1.35}
.stage .sn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--line);font-weight:700;font-size:.85rem}
.stage.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.stage.dn .sn{background:var(--good-soft);color:var(--good)}
.stage[disabled]{opacity:.5}

.skills{list-style:none;padding:0;display:grid;gap:8px}
.skc{display:grid;grid-template-columns:1fr auto 76px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink)}
.skc:hover:not(.locked){border-color:var(--accent)}
.skc.locked{opacity:.55}
.skc.ms{border-color:var(--good)}
.skc .nm{font-weight:700;min-width:0}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink-2);display:inline-block}
.dots i.y{background:var(--good);border-color:var(--good)}
.dots i.n{background:var(--bad);border-color:var(--bad)}

.phase{display:grid;gap:12px;margin-bottom:26px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:6px}
.gate{font-size:.85rem;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex,.reteach,.vis{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.reteach{border-color:var(--accent-2);margin-bottom:12px}
.vis{background:var(--accent-soft);border:0}
.vis label{display:grid;gap:2px;font-size:.9rem;min-width:150px;flex:1}
.vis input[type=range]{width:100%;accent-color:var(--accent)}
.steps{padding-left:1.4em;display:grid;gap:8px;margin:0}
.steps li{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.st-m{min-width:0;overflow-x:auto;max-width:100%}
.st-w{font-size:.9rem;color:var(--ink-2)}
.steps li.blank{display:grid;gap:4px}
.blank input,.answer1 input{font-size:1.05rem;padding:.35em .6em;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%;max-width:340px;font-family:ui-monospace,Menlo,monospace}
.bfb{font-size:.88rem}
.bfb.y{color:var(--good);font-weight:700}
.bfb.n{color:var(--bad)}
.chk{font-size:.92rem;color:var(--good)}

.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2)}
.rv{color:var(--accent-2)}
.qtext{font-size:1.04rem}
.qtex{font-size:1.25rem;overflow-x:auto}
.fig{overflow-x:auto}
.fmt{font-size:.84rem;color:var(--ink-2)}
.ansarea{display:grid;gap:8px}
.ansarea input,.ansarea textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;padding:.45em .7em;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%;max-width:460px}
.ansarea textarea{line-height:1.5}
.ansarea input:focus,.ansarea textarea:focus,.explain textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.modes{display:flex;flex-wrap:wrap;gap:6px}
.mt{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:.25em .8em;font-size:.84rem;font-weight:700;color:var(--ink-2)}
.mt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{min-width:38px;padding:.25em .55em;border-radius:7px;border:1px solid var(--line);background:var(--paper);font-family:ui-monospace,Menlo,monospace}
.preview{display:grid;gap:2px;font-size:.95rem}
.pl{display:flex;gap:10px;align-items:baseline;min-width:0;overflow-x:auto}
.pl .ln{font-size:.74rem;color:var(--ink-2);min-width:1.5em}
.act{margin-top:2px}
.hcost{font-size:.8rem;color:var(--ink-2)}
.hintbox{display:grid;gap:6px}
.hint{background:var(--hl);color:var(--hl-ink);border-radius:8px;padding:8px 12px;font-size:.95rem}
.choices{display:grid;gap:8px}
.choice{text-align:left;padding:.65em 1em;border-radius:9px;border:1.5px solid var(--line);background:var(--paper);font-size:1.02rem}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.fbx{border-radius:9px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.fbx.good{background:var(--good-soft)}
.fbx.bad{background:var(--bad-soft)}
.fbx.warn{background:var(--warn-soft)}
.fbx strong{font-family:var(--f-display);font-size:1.05rem}
.fbx.good strong{color:var(--good)}
.fbx.bad strong{color:var(--bad)}
.fbx.warn strong{color:var(--warn)}
.fbx .steps{background:var(--card);border-radius:8px;padding:10px 12px 10px 30px}
.fbx summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:.15em .6em;border-radius:99px;background:var(--card);color:var(--bad);border:1px solid var(--bad);width:max-content;max-width:100%}
.ask{font-size:1rem}
.fix{font-size:.92rem}
.note{border-radius:8px;padding:8px 12px;background:var(--accent-soft);font-size:.94rem}
.note.good{background:var(--good-soft)}
.note.warn{background:var(--warn-soft)}
.explain{border-top:1.5px dashed var(--line);padding-top:12px;display:grid;gap:8px}
.explain textarea{font:inherit;padding:.5em .7em;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.card textarea{font:inherit;font-size:16px;padding:.5em .7em;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%;font-family:ui-monospace,Menlo,monospace}
#bkp{margin-top:12px}
.setintro{display:grid;gap:10px;justify-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}

.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:.25em .8em;font-size:.84rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
select{padding:.3em .5em;border-radius:7px;border:1px solid var(--line);background:var(--card)}
.log{list-style:none;padding:0;display:grid;gap:8px}
.log li{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:var(--r);padding:10px 14px;display:grid;gap:6px;min-width:0}
.lh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.84rem}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.9rem}
.refd{margin-bottom:18px;display:grid;gap:8px}
.refd dl{margin:0;display:grid;gap:4px}
.refd dt{font-weight:700;margin-top:8px}
.refd dd{margin:0;overflow-x:auto;min-width:0}
.refd dl,.refd{min-width:0}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:52px 1fr 40px;gap:10px;align-items:center;font-size:.88rem}
.weak{padding-left:1.2em;display:grid;gap:12px}
.weak p{font-size:.92rem;margin:4px 0}

/* graphics */
.graph{width:100%;max-width:300px;height:auto;display:block}
.graph .g{stroke:var(--line);stroke-width:1}
.graph .ax{stroke:var(--ink-2);stroke-width:1.6}
.graph .t{fill:var(--ink-2);font-size:10px;font-family:var(--f-body)}
.graph .al{font-style:italic;font-size:13px;font-family:Georgia,serif}
.graph .ln{stroke-width:3;stroke-linecap:round;fill:none}
.graph .ln0{stroke:var(--accent)}
.graph .ln1{stroke:var(--accent-2)}
.graph .dot{fill:var(--ink);stroke:var(--card);stroke-width:2}
.nl{width:100%;max-width:360px;height:auto;display:block}
.nl .axis{stroke:var(--ink-2);stroke-width:1.6}
.nl .tk{stroke:var(--ink-2);stroke-width:1.2}
.nl text{fill:var(--ink-2);font-size:10.5px;font-family:var(--f-body)}
.nl .ray{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.nl .head{fill:var(--accent)}
.nl .closed{fill:var(--accent);stroke:var(--accent);stroke-width:2.5}
.nl .open{fill:var(--card);stroke:var(--accent);stroke-width:2.5}
.nl .hop{stroke:var(--accent-2);stroke-width:2.5}
.bal{width:100%;max-width:360px;height:auto}
.bal .beam{stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.bal .base{fill:var(--ink-2)}
.bal .pan{fill:var(--ink-2)}
.bal .xb{fill:var(--accent)}
.bal .xt{fill:var(--on-accent);font-style:italic;font-family:Georgia,serif;font-size:15px}
.bal .ub{fill:var(--accent-2)}
.boxwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.boxm{border-collapse:collapse}
.boxm th{padding:6px 10px;font-weight:400}
.boxm td{border:2px solid var(--ink-2);width:86px;height:64px;text-align:center}
.boxm td.sq{background:var(--accent-soft)}
.boxm td.ct{background:var(--hl);color:var(--hl-ink)}
.gtgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.gts{display:grid;gap:10px;min-width:0}
.gts .sl{display:flex;flex-wrap:wrap;gap:10px}
.vt{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.vt th,.vt td{border:1px solid var(--line);padding:4px 8px;text-align:center;background:var(--card)}
.gtinfo{font-size:.9rem}

@media (max-width:620px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .days,.sumgrid{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gtgrid{grid-template-columns:1fr}
  .skc{grid-template-columns:1fr auto;}
  .skc .pc{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* course switcher: one bar above both courses */
.course{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);font-family:var(--f-body)}
.course a{font-weight:700;font-size:.92rem;text-decoration:none;color:var(--ink-2);padding:.4em 1em;border-radius:999px;border:1.5px solid var(--line)}
.course a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
#biz[hidden],#app[hidden]{display:none!important}
</style>
</head>
<body>
<nav class="course" aria-label="Course"><a href="#home" data-c="alg">Algebra 1 · 7 days</a><a href="#b-home" data-c="biz">Business · Ch. 1–7</a></nav>
<div class="wrap" id="app"><p style="padding:40px 0">Loading…</p></div>
<div id="biz" hidden></div>
<script src="katex.min.js"></script>
<script>
/* ================= CORE: random, formatting, parser, checking ================= */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const RNZ=(a,b,ex=[0])=>{let n,g=0;do{n=R(a,b);g++}while(ex.includes(n)&&g<500);return n};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const clean=n=>{const r=Math.round(n*1e9)/1e9;return Object.is(r,-0)?0:r};
const num=n=>String(clean(n));
const pn=n=>n<0?`(${num(n)})`:num(n);
const pp=n=>`(${num(n)})`;                     // always parenthesize (substitution next to a coefficient)            // parenthesize negatives
const sg=n=>n<0?'-':'+';
const ab=Math.abs;
/* polynomial / linear text valid for both TeX and the parser. terms: [[coef,'x^2'],[coef,'x'],[coef,'']] */

/* factor structure: {c: constant, f: count of non-constant factors} */

/* ---------- answer kinds ---------- */
const FORMAT={num:'Type a number: 7, -3, 2/5, or 0.25.',eq:'Type the value of the variable, like x = 7 (or just 7).',ineq:'Type an inequality like x < 4. Use <= for ≤ and >= for ≥.',
  compound:'Type like -2 < x <= 5, or x < 1 or x > 4.',pair:'Type an ordered pair, like (2, -3).',set:'Type all solutions separated by commas, like 3, -5. Exact (sqrt(2)) or 2-decimal answers both work.',
  expr:'Type an expression, like 3x^2 - 5x + 2. Use ^ for exponents.',line:'Type an equation of the line, like y = 2x - 3.',literal:'Type the expression, like (P - 2l)/2.',sci:'Type like 3.2*10^5 (or 3.2 x 10^-4).',
  mc:'',interval:''};
function stripVar(s,v='x'){return String(s).replace(new RegExp('^\\s*'+v+'\\s*=\\s*'),'')}

    case 'eq':{const v=numVal(stripVar(s,Q.v||'x'));const target=typeof ans==='number'?ans:numVal(ans);return {ok:near(v,target,Q.tol),val:v}}

    case 'pair':{const parts=s.replace(/[()\s]/g,'').replace(/[xy]=/gi,'').split(/[,;]/);if(parts.length!==2)return {invalid:FORMAT.pair};
      const a=numVal(parts[0]),b=numVal(parts[1]);return {ok:near(a,ans[0])&&near(b,ans[1])}}

/* independent verification that the stored answer is right */

/* ---------- drawings (theme-aware via CSS classes) ---------- */
let GID=0;
function graphSVG({lines=[],curves=[],dots=[],range=6,label='Graph'}={}){
  const W=260,S=(W-20)/(2*range),C=W/2,px=x=>C+x*S,py=y=>C-y*S,id='cl'+(++GID);
  let s=`<svg viewBox="0 0 ${W} ${W}" class="graph" role="img" aria-label="${label}"><defs><clipPath id="${id}"><rect x="10" y="10" width="${W-20}" height="${W-20}"/></clipPath></defs>`;
  for(let i=-range;i<=range;i++)s+=`<line class="g" x1="${px(i)}" y1="10" x2="${px(i)}" y2="${W-10}"/><line class="g" x1="10" y1="${py(i)}" x2="${W-10}" y2="${py(i)}"/>`;
  s+=`<line class="ax" x1="10" y1="${C}" x2="${W-10}" y2="${C}"/><line class="ax" x1="${C}" y1="10" x2="${C}" y2="${W-10}"/>`;
  const st=range>8?4:2;for(let i=-range+ (range%st); i<=range; i+=st){if(!i||ab(i)===range)continue;s+=`<text class="t" x="${px(i)}" y="${C+13}" text-anchor="middle">${i}</text><text class="t" x="${C-4}" y="${py(i)+3.5}" text-anchor="end">${i}</text>`}
  s+=`<text class="t al" x="${W-12}" y="${C-5}" text-anchor="end">x</text><text class="t al" x="${C+6}" y="21">y</text>`;
  lines.forEach((L,k)=>{const x1=-range-1,x2=range+1;s+=`<line class="ln ln${k}" clip-path="url(#${id})" x1="${px(x1)}" y1="${py(L.m*x1+L.b)}" x2="${px(x2)}" y2="${py(L.m*x2+L.b)}"/>`});
  curves.forEach((f,k)=>{let d='';for(let i=0;i<=160;i++){const x=-range-.5+i*(2*range+1)/160;const y=f(x);if(!isFinite(y))continue;d+=(d?'L':'M')+px(x).toFixed(1)+' '+Math.max(-500,Math.min(800,py(y))).toFixed(1)}s+=`<path class="ln ln${k+lines.length}" clip-path="url(#${id})" fill="none" d="${d}"/>`});
  dots.forEach(([x,y])=>{s+=`<circle class="dot" cx="${px(x)}" cy="${py(y)}" r="4.5"/>`});
  return s+'</svg>';
}
function numberLineSVG(parts,{lo,hi}={}){/* parts: [{from,to,fromIncl,toIncl}] with ±Infinity */

}

const OPT={'<':'<','>':'>','<=':'\\le','>=':'\\ge'},FL={'<':'>','>':'<','<=':'>=','>=':'<='};
const ray=(op,v)=>op[0]==='<'?{from:-Infinity,to:v,toIncl:op.includes('=')}:{from:v,to:Infinity,fromIncl:op.includes('=')};
/* coefficient times x for possibly-fractional m (TeX + parser friendly) */
function mxTex(m,v='x'){if(Number.isInteger(m))return m===1?v:m===-1?'-'+v:m+v;const [p,q]=ratio(m);return (p<0?'-':'')+`\\frac{${ab(p)}}{${q}}${v}`}
function ratio(v){for(let d=1;d<=100;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-9)return red(n,d)}return [v,1]}
function lineTex(m,b){const mx=m===0?'':mxTex(m);if(!mx)return niceTex(b);return mx+(b?` ${b<0?'-':'+'} ${niceTex(ab(b))}`:'')}
function niceTex(v){if(Number.isInteger(clean(v)))return num(v);const [n,d]=ratio(v);if(d<=100&&Math.abs(n/d-v)<1e-9)return fr(n,d);return num(+v.toFixed(4))}
function niceA(v){if(Number.isInteger(clean(v)))return num(v);const [n,d]=ratio(v);if(d<=100&&Math.abs(n/d-v)<1e-9)return fa(n,d);return num(+v.toFixed(4))}

const sys=(a,b)=>`\\begin{cases} ${a} \\\\ ${b} \\end{cases}`;
const lxy=(a,b)=>poly([[a,'x'],[b,'y']]);

  return {text:'Use the graph to solve the system.',kind:'pair',tex:sys(`y = ${lineTex(m1,b1)}`,`y = ${lineTex(m2,b2)}`),eqs:[`y = ${m1}x + ${b1}`.replace('+ -','- '),`y = ${m2}x + ${b2}`.replace('+ -','- ')],ans:[x0,y0],fig:graphSVG({lines:[{m:m1,b:b1},{m:m2,b:b2}],dots:[[x0,y0]]}),
   steps:[[`(${x0}, ${y0})`,'The lines cross at this point'],[`${y0} = ${m1===1?'':m1===-1?'-':niceTex(m1)}(${x0})${b1?` ${b1<0?'-':'+'} ${niceTex(ab(b1))}`:''}`,'Check it in the first equation'],[`${y0} = ${m2===1?'':m2===-1?'-':niceTex(m2)}(${x0})${b2?` ${b2<0?'-':'+'} ${niceTex(ab(b2))}`:''}`,'Check it in the second equation']],
   traps:[TR([y0,x0],'other',0,'In an ordered pair, which comes first: x or y?')]}},
 lvl=>{const m=RNZ(-4,4),b=RNZ(-6,6),k=R(0,2);let e2,ans;if(k===0){let m2;do{m2=RNZ(-4,4)}while(m2===m);e2=`y = ${lin(m2,RNZ(-6,6))}`;ans=0}else if(k===1){let b2;do{b2=RNZ(-6,6)}while(b2===b);e2=`y = ${lin(m,b2)}`;ans=1}else{const c=R(2,3);e2=`${c}y = ${lin(c*m,c*b)}`;ans=2}

   traps:[TR(poly([[a*c,'x^2'],[b*d,'']]),'other',0,'FOIL gives four products. Which two did you skip?')]}},

S({id:'gcf',day:6,name:'Factoring out the GCF',
 method:'Find the greatest common factor of all terms (numbers and variables), divide each term by it, and write GCF(…).',
 hint:'What is the largest number and highest power of x that divides every term?',
 ref:'$6x+9=3(2x+3)$. $4x^3-10x^2=2x^2(2x-5)$. Check by distributing.',
 why:{q:'How can you check that a factoring is correct?',keys:[/distribut|multipl|expand|back|original/],model:'Multiply the factors back out (distribute); you should get the original expression.'},
 gens:[
 lvl=>{let g,a,b;do{g=R(2,9);a=R(1,7);b=RNZ(-9,9)}while(gcd(a,b)!==1);const src=lin(g*a,g*b),ans=`${g}(${lin(a,b)})`;
  return {text:'Factor completely.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`\\text{GCF} = ${g}`,`${g} is the largest number dividing ${g*a} and ${ab(g*b)}`],[ans,'Divide each term by the GCF']],traps:[]}},
 lvl=>{let g,a,b,n;do{g=R(2,6);a=R(1,5);b=RNZ(-9,9);n=R(1,2)}while(gcd(a,b)!==1);const src=poly([[g*a,`x^{${n+1}}`],[g*b,n===1?'x':`x^{${n}}`]]),gx=n===1?`${g}x`:`${g}x^{${n}}`,ans=`${gx}(${lin(a,b)})`;
  return {text:'Factor completely.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`\\text{GCF} = ${gx}`,`Largest number: ${g}; lowest power of x: ${n===1?'x':'x^'+n}`],[ans,'Divide each term by the GCF']],traps:[]}}
 ]});

const binom=(a,p)=>`(${lin(a,p)})`;
S({id:'tri1',day:6,name:'Factoring trinomials (a = 1)',visual:'box',
 method:'For $x^2+bx+c$, find two numbers that multiply to $c$ and add to $b$. Then write $(x+p)(x+q)$.',
 hint:'List factor pairs of c. Which pair adds to b?',
 ref:'$x^2+7x+12=(x+3)(x+4)$ since $3\\cdot4=12$ and $3+4=7$. $c>0$: same signs. $c<0$: opposite signs.',
 why:{q:'Why do you look for numbers that multiply to c and add to b?',keys:[/foil|multipl|middle|last|product|sum|outer|inner/],model:'When you FOIL (x + p)(x + q), the last term is p·q and the middle term is (p + q)x.'},
 gens:[
 lvl=>{const p=RNZ(-9,9),q=RNZ(-9,9),src=poly([[1,'x^2'],[p+q,'x'],[p*q,'']]),ans=`${binom(1,p)}${binom(1,q)}`;
  return {text:'Factor.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`${p} \\cdot ${pn(q)} = ${p*q},\\; ${p} + ${pn(q)} = ${p+q}`,'Find two numbers that multiply to c and add to b'],[ans,'Write the two binomials']],
   traps:[TR(`${binom(1,-p)}${binom(1,-q)}`,'sign',1,'Check by FOIL: does the middle term have the right sign?')]}},
 lvl=>{const k=R(2,5),p=RNZ(-7,7),q=RNZ(-7,7),src=poly([[k,'x^2'],[k*(p+q),'x'],[k*p*q,'']]),ans=`${k}${binom(1,p)}${binom(1,q)}`;
  return {text:'Factor completely.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`${k}(${poly([[1,'x^2'],[p+q,'x'],[p*q,'']])})`,`Factor out the GCF, ${k}, first`],[ans,'Factor the trinomial inside']],traps:[]}}
 ]});

S({id:'tri2',day:6,name:'Factoring trinomials (a ≠ 1)',visual:'box',
 method:'AC method: multiply $a\\cdot c$, find two numbers with that product that add to $b$, split the middle term, and factor by grouping.',
 hint:'What is a · c? Which factor pair of it adds to b?',

 why:{q:'Why do you split the middle term into two terms?',keys:[/group|pair|common|factor/],model:'Splitting it lets you factor by grouping: each pair shares a common factor.'},
 gens:[
 lvl=>{let a,p,q;do{a=R(2,5);p=RNZ(-7,7);q=RNZ(-7,7)}while(gcd(a,p)!==1);const src=poly([[a,'x^2'],[a*q+p,'x'],[p*q,'']]),ans=`${binom(a,p)}${binom(1,q)}`;
  return {text:'Factor.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`ac = ${a*p*q}: \\; ${a*q} \\cdot ${pn(p)} = ${a*p*q},\\; ${a*q} + ${pn(p)} = ${a*q+p}`,'Find two numbers with product ac that add to b'],[poly([[a,'x^2'],[a*q,'x'],[p,'x'],[p*q,'']]),'Split the middle term'],[`${a}x(${lin(1,q)}) ${p<0?'-':'+'} ${ab(p)}(${lin(1,q)})`,'Factor each pair'],[ans,'Factor out the common binomial']],
   traps:[TR(`${binom(a,q)}${binom(1,p)}`,'other',3,'FOIL your answer. Does the middle term match?')]}},

  return {text:'Factor.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`ac = ${a*b*p*q}`,'Multiply a and c'],[`${a*q} \\text{ and } ${b*p}`,`They multiply to ${a*b*p*q} and add to ${a*q+b*p}`],[ans,'Split, group, and factor']],traps:[]}}
 ]});

S({id:'dos',day:6,name:'Difference of squares',

 gens:[
 lvl=>{const k=R(2,12),src=`x^2 - ${k*k}`,ans=`(x + ${k})(x - ${k})`;
  return {text:'Factor.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`x^2 - ${k}^2`,'Both terms are perfect squares'],[ans,'(a + b)(a − b)']],traps:[TR(`(x - ${k})^2`,'binsq',1,'FOIL $(x - '+k+')^2$. Does it give a middle term?')]}},

  return {text:'Factor.',kind:'expr',form:'factored',tex:src,src,ans,steps:[[`(${a}x)^2 - ${k}^2`,'Write each term as a square'],[ans,'(a + b)(a − b)']],traps:[TR(`(${a}x - ${k})^2`,'binsq',1,'Is there a middle term in the original?')]}}
 ]});

S({id:'zpp',day:7,name:'Solving quadratics by factoring',visual:'box',
 method:'Get 0 on one side, factor, then use the zero product property: set each factor equal to 0.',
 hint:'Is one side 0? What are the factors?',
 ref:'$x^2-x-6=0 \\Rightarrow (x-3)(x+2)=0 \\Rightarrow x=3$ or $x=-2$. Never divide both sides by x: you lose $x=0$.',
 why:{q:'Why must one side equal 0 before you use the factors?',keys:[/zero|0/],model:'The zero product property only works for 0: if a·b = 0, then a or b is 0. A product equal to 6 tells you nothing about each factor.'},
 gens:[
 lvl=>{const p=RNZ(-9,9),q=RNZ(-9,9,[0,p]),src=`(${lin(1,-p)})(${lin(1,-q)}) = 0`;
  return {text:'Solve. Give all solutions.',kind:'set',src,tex:src,ans:[p,q],nroots:2,steps:[[`${lin(1,-p)} = 0 \\text{ or } ${lin(1,-q)} = 0`,'Zero product property: set each factor to 0'],[`x = ${p} \\text{ or } x = ${q}`,'Solve each']],traps:[TR([-p,-q],'sign',1,'If x − 3 = 0, is x equal to 3 or −3?')]}},
 lvl=>{const p=RNZ(-9,9),q=RNZ(-9,9,[0,p]),src=`${poly([[1,'x^2'],[-(p+q),'x'],[p*q,'']])} = 0`;
  return {text:'Solve by factoring.',kind:'set',src,tex:src,ans:[p,q],nroots:2,steps:[[`(${lin(1,-p)})(${lin(1,-q)}) = 0`,`Factor: ${-p} and ${-q} multiply to ${p*q} and add to ${-(p+q)}`],[`x = ${p} \\text{ or } x = ${q}`,'Set each factor to 0']],traps:[TR([-p,-q],'sign',1,'The factor (x + 2) gives x = ? Check the sign.')]}},
 lvl=>{const a=R(1,5),k=RNZ(-8,8);const b=-a*k,src=`${poly([[a,'x^2'],[b,'x']])} = 0`;
  return {text:'Solve. Give all solutions.',kind:'set',src,tex:src,ans:[0,k],nroots:2,steps:[[`${a===1?'':a}x(${lin(1,-k)}) = 0`,'Factor out the GCF'],[`x = 0 \\text{ or } x = ${k}`,'Set each factor to 0']],traps:[TR([k],'other',1,'If you divided by x, which solution did you lose?')]}},
 lvl=>{const p=RNZ(-7,7),q=RNZ(-7,7,[p]),d=RNZ(-9,9),src=`${poly([[1,'x^2'],[-(p+q),'x'],[p*q+d,'']])} = ${d}`;
  return {text:'Solve. Give all solutions.',kind:'set',src,tex:src,ans:[p,q],nroots:2,steps:[[`${poly([[1,'x^2'],[-(p+q),'x'],[p*q,'']])} = 0`,`${d>0?'Subtract':'Add'} ${ab(d)} so one side is 0`],[`(${lin(1,-p)})(${lin(1,-q)}) = 0`,'Factor'],[`x = ${p} \\text{ or } x = ${q}`,'Zero product property']],traps:[]}}
 ]});

S({id:'qform',day:7,name:'The quadratic formula',
 method:'Write $ax^2+bx+c=0$, identify $a,b,c$, and use $x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$.',
 hint:'Is it in the form ax² + bx + c = 0? What are a, b, and c (with signs)?',
 ref:'$x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$. For $x^2+2x-3=0$: $x=\\frac{-2\\pm\\sqrt{16}}{2}$, so $x=1$ or $x=-3$.',
 why:{q:'Why does the formula start with −b?',keys:[/opposite|negative|sign|-b|−b|formula/],model:'The formula uses the opposite of b; if b is already negative, −b is positive.'},
 gens:[
 lvl=>{const a=lvl>=2?R(1,3):1,p=RNZ(-6,6),q=RNZ(-6,6,[p]);const A=a,B=-a*(p+q),C=a*p*q,src=`${poly([[A,'x^2'],[B,'x'],[C,'']])} = 0`,D=B*B-4*A*C;
  return {text:'Solve using the quadratic formula.',kind:'set',src,tex:src,ans:[p,q],nroots:2,steps:[[`a = ${A},\\; b = ${B},\\; c = ${C}`,'Identify a, b, c with their signs'],[`x = \\frac{${-B} \\pm \\sqrt{${D}}}{${2*A}}`,`b² − 4ac = ${B*B} − ${pn(4*A*C)} = ${D}`],[`x = ${p} \\text{ or } x = ${q}`,'Evaluate the + and − cases']],traps:[TR([-p,-q],'sign',1,'The formula starts with −b. What is −b here?')]}},
 lvl=>{let a,b,c,D;do{a=R(1,3);b=RNZ(-7,7);c=RNZ(-7,7);D=b*b-4*a*c}while(D<=0||Number.isInteger(Math.sqrt(D)));const src=`${poly([[a,'x^2'],[b,'x'],[c,'']])} = 0`,r1=(-b+Math.sqrt(D))/(2*a),r2=(-b-Math.sqrt(D))/(2*a);
  return {text:'Solve using the quadratic formula. Give exact answers or round to 2 decimals.',kind:'set',tol:0.006,src,tex:src,ans:[r1,r2],nroots:2,steps:[[`a = ${a},\\; b = ${b},\\; c = ${c}`,'Identify a, b, c'],[`x = \\frac{${-b} \\pm \\sqrt{${D}}}{${2*a}}`,`Discriminant: ${b*b} − ${pn(4*a*c)} = ${D}`],[`x \\approx ${r1.toFixed(2)} \\text{ or } x \\approx ${r2.toFixed(2)}`,'Evaluate each']],
   traps:[TR([(b+Math.sqrt(D))/(2*a),(b-Math.sqrt(D))/(2*a)],'sign',1,'Did you use −b in the numerator?'),TR([-b+Math.sqrt(D)/(2*a),-b-Math.sqrt(D)/(2*a)],'fraction',2,'Does the 2a divide the whole numerator, including −b?')]}},
 lvl=>{const P=R(2,6)*-1,p=R(10,40),r=pick([10,20,25,50]);/* revenue R = p*x - x^2... keep: projectile-free retail: area */const w=R(3,12),L=w+R(2,8),A=w*L,d=L-w,src=`x(x + ${d}) = ${A}`;
  return {text:`A rectangular display table is ${d} ft longer than it is wide and has an area of ${A} sq ft. Find its width $x$ (in ft). Enter the positive solution.`,kind:'num',ans:w,chk:()=>w*(w+d)===A,steps:[[`x^2 + ${d}x - ${A} = 0`,'Width × length = area; move everything to one side'],[`(x - ${w})(x + ${L}) = 0`,'Factor (or use the quadratic formula)'],[`x = ${w}`,'A width must be positive, so reject the negative root']],traps:[TR(-L,'other',2,'Can a width be negative?')]}}
 ]});

/* ---------- problem card ---------- */
/* mode: practice (hints, 2 tries, self-explain) | check (no hints, 2 tries scored on first) | probe (1 try, no solution) | test (1 try, no feedback) */
function problem(Q,host,{mode='practice',label='',onDone}){
  window.__Q=Q;const s=SK[Q.skill];let tries=0,hints=0,done=false,checked=null,stepMode=false;
  const stepable=Q.kind==='eq'||Q.kind==='ineq';
  const needCheck=Q.kind==='eq'&&Q.src;
  host.innerHTML=`<div class="qcard"><div class="qmeta"><span>${esc(s.name)}${Q.review?' · <b class="rv">Review</b>':''}</span><span>${label}${mode==='practice'?` · Level ${Q.lvl}`:''}</span></div>
   <div class="qtext">${md(Q.text)}</div>${Q.tex?`<div class="qtex">${K(Q.tex,true)}</div>`:''}${Q.fig&&!Q.figAfter?`<div class="fig">${Q.fig}</div>`:''}
   <div class="ansarea"></div><div class="hintbox"></div><div class="fb"></div></div>`;
  const area=host.querySelector('.ansarea'),fb=host.querySelector('.fb'),hb=host.querySelector('.hintbox');
  let input,sel=-1;
  function build(){
    if(Q.kind==='mc'){area.innerHTML=`<div class="choices">${Q.choices.map((c,i)=>`<button class="choice" data-i="${i}" type="button">${isTexChoice(c)?K(c):esc(c)}</button>`).join('')}</div><div class="row act"><button class="btn" id="submit" disabled>Submit</button></div>`;
      area.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;sel=+b.dataset.i;area.querySelectorAll('.choice').forEach(c=>c.classList.toggle('sel',c===b));area.querySelector('#submit').disabled=false});
    }else{
      area.innerHTML=`<label class="fmt" for="answer">${esc(FORMAT[Q.kind]||'')}</label>
       ${stepable?`<div class="modes"><button type="button" class="mt" data-m="0" aria-pressed="${!stepMode}">Answer only</button><button type="button" class="mt" data-m="1" aria-pressed="${stepMode}">Step mode (one line per step)</button></div>`:''}
       ${stepMode?`<textarea id="answer" rows="5" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="3x - 5 = 16&#10;3x = 21&#10;x = 7"></textarea>`:`<input id="answer" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">`}
       <div class="keys">${(KEYS[Q.kind]||[]).map(k=>`<button class="key" type="button" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>
       <div class="preview" aria-live="polite"></div>
       <div class="row act">${needCheck?'<button class="btn quiet" id="checkit" type="button">Check it (substitute)</button>':''}<button class="btn" id="submit" ${needCheck?'disabled':''}>Submit</button>${mode==='practice'?'<button class="btn ghost" id="hint" type="button">Hint 1 of 3</button>':''}</div><div class="checkout"></div>`;
      input=area.querySelector('#answer');
      area.querySelectorAll('.key').forEach(k=>k.onclick=()=>insertAt(input,k.dataset.k.replace('−','-')));
      area.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{stepMode=b.dataset.m==='1';const v=input.value;build();input.value=v;input.dispatchEvent(new Event('input'))});
      input.addEventListener('input',()=>{checked=null;const sb=area.querySelector('#submit');if(needCheck)sb.disabled=true;area.querySelector('.checkout').innerHTML='';preview()});
      if(!stepMode)input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();(needCheck&&!checked?area.querySelector('#checkit'):area.querySelector('#submit')).click()}});
      const ci=area.querySelector('#checkit');if(ci)ci.onclick=checkIt;
      if(matchMedia('(hover:hover)').matches)input.focus({preventScroll:true});
    }
    area.querySelector('#submit').onclick=submit;const hbtn=area.querySelector('#hint');if(hbtn)hbtn.onclick=hint;
    if(Q.fig&&Q.figAfter&&done)area.insertAdjacentHTML('beforeend',`<div class="fig">${Q.fig}</div>`);
  }
  function lines(){return input.value.split('\n').map(x=>x.trim()).filter(Boolean)}
  function preview(){const pv=area.querySelector('.preview');const ls=stepMode?lines():[input.value.trim()].filter(Boolean);
    pv.innerHTML=ls.map((l,i)=>{let t;try{const r=/(<|>|=|≤|≥)/.test(l)&&!/^\s*x\s*=\s*[^=]*$/.test('')?parseRel(l.replace(/\bor\b/g,' or ')):null;if(r){t=r.map(p=>p.sides.map(tex).reduce((acc,sd,j)=>acc+(j?` ${OPT[p.ops[j-1]]||p.ops[j-1]} `:'')+sd,'')).join('\\text{ or }')}else if(Q.kind==='pair'||Q.kind==='set'||Q.kind==='sci'){t=null}else t=tex(parseExpr(l))}catch(e){t=null}
      return `<div class="pl">${stepMode?`<span class="ln">${i+1}</span>`:'<span class="ln">You entered</span>'}${t?K(t):`<code>${esc(l)}</code>`}</div>`}).join('')}
  function finalText(){if(!stepMode)return input.value;const ls=lines();return ls[ls.length-1]||''}
  function checkIt(){const raw=finalText();let v;try{v=numVal(stripVar(raw,Q.v))}catch(e){area.querySelector('.checkout').innerHTML=`<div class="note">${stepMode?'End with a line like x = 7. ':''}${esc(e.message)}</div>`;return}
    const r=parseRel(Q.src)[0],env={[Q.v]:v};let L,Rr;try{L=ev(r.sides[0],env);Rr=ev(r.sides[1],env)}catch(e){return}const ok=Math.abs(L-Rr)<1e-7*(1+Math.abs(Rr));
    area.querySelector('.checkout').innerHTML=`<div class="note ${ok?'good':'warn'}">Substituting ${K(`${Q.v} = ${niceTex(v)}`)}: left side = ${K(niceTex(clean(L)))}, right side = ${K(niceTex(clean(Rr)))}. ${ok?'They match. Submit when ready.':'They do not match, so something is off. You can fix it before you submit, or submit anyway.'}</div>`;
    checked=raw;area.querySelector('#submit').disabled=false}
  function hint(){if(done)return;hints++;const lad=[`<b>Hint 1 · Guiding question:</b> ${md(Q.hint||s.hint)}`,`<b>Hint 2 · Method:</b> ${md(s.method)}`,`<b>Hint 3 · First step:</b> ${md(Q.steps[0][1])}: ${K(Q.steps[0][0])}`];
    hb.innerHTML=lad.slice(0,hints).map(x=>`<div class="hint">${x}</div>`).join('');const b=area.querySelector('#hint');if(hints>=3)b.disabled=true;else b.textContent=`Hint ${hints+1} of 3`;b.insertAdjacentHTML('afterend','');
    let n=b.parentNode.querySelector('.hcost');if(!n){n=h('<span class="hcost">Hints don’t count toward mastery.</span>');b.after(n)}}
  /* step-mode pinpointing */
  function stepDiag(){const ls=lines();if(!ls.length)return null;let prev=parseRel(Q.src),prevTxt=Q.src;
    for(let i=0;i<ls.length;i++){let r;try{r=parseRel(ls[i])}catch(e){return {line:i,tag:'other',msg:`Line ${i+1} could not be read: ${e.message}`}}
      const okLine=Q.kind==='eq'?(()=>{const t=linRoot(r,Q.v);return 'x' in t&&near(t.x,Q.ans)})():sameSolutionSet(r,parseRel(Q.src));
      if(!okLine){let tag='other';try{
        if(Q.kind==='ineq'){const b1=boundaries(r),b0=boundaries(parseRel(Q.ans));if(b1.some(x=>b0.some(y=>near(x,y))))tag='flip'}
        if(tag==='other'&&r[0].sides.length===2&&prev[0].sides.length===2){const v=[Q.v];const sameL=exprEquiv(r[0].sides[0],prev[0].sides[0],v),sameR=exprEquiv(r[0].sides[1],prev[0].sides[1],v);if(sameL!==sameR)tag='oneside'}

        if(tag==='other'&&/-\s*\d*\s*\(/.test(prevTxt))tag='distneg'}catch(e){}
        return {line:i,tag,msg:`Line ${i+1} is where it goes wrong: ${K(ls[i].replace(/<=/g,'\\le ').replace(/>=/g,'\\ge '))}. ${i?`Line ${i} was still correct.`:'It does not follow from the original problem.'}`}}
      prev=r;prevTxt=ls[i]}
    return null}
  function diagnose(raw){let trap=null;for(const t of Q.traps||[]){try{if(checkAnswer(Q,raw,t.a).ok){trap=t;break}}catch(e){}}
    let sd=stepMode?stepDiag():null;let tag=trap?trap.tag:(sd?sd.tag:'other');
    if(tag==='other'&&Q.kind==='num'){try{if(near(numVal(stripVar(raw,'[a-zA-Z]')),-Q.ans))tag='sign'}catch(e){}}
    const where=sd?sd.msg:(trap?`The error most likely happens at the step "${md(Q.steps[Math.min(trap.step,Q.steps.length-1)][1])}".`:'');
    return {tag,where,ask:trap?trap.ask:(Q.hint||s.hint),stepLine:sd?sd.line:null}}
  function submit(){if(done)return;let raw;
    if(Q.kind==='mc'){if(sel<0)return;raw=String(sel)}else raw=finalText();
    const r=checkAnswer(Q,raw);if(r.invalid){fb.innerHTML=`<div class="note">${esc(r.invalid)}</div>`;return}
    const given=Q.kind==='mc'?Q.choices[sel]:(stepMode?input.value:raw);
    if(r.ok)return finish(true,given);
    tries++;const dg=diagnose(raw);Q.firstTag=Q.firstTag||dg.tag;Q.firstGiven=Q.firstGiven||given;
    if(mode==='test'||mode==='probe'||tries>=2)return finish(false,given,dg);
    fb.innerHTML=`<div class="fbx bad"><strong>Not quite.</strong>${dg.tag!=='other'?`<span class="tag">${esc(TAGS[dg.tag])}</span>`:''}${dg.where?`<p>${dg.where}</p>`:''}<p class="ask"><b>Guiding question:</b> ${md(dg.ask)}</p><p class="muted">Try again. The correction appears after a second miss.</p></div>`;
    if(Q.kind==='mc'){area.querySelector(`.choice[data-i="${sel}"]`).classList.add('wrong');area.querySelector(`.choice[data-i="${sel}"]`).disabled=true;sel=-1;area.querySelector('#submit').disabled=true}
    else{checked=null;if(needCheck)area.querySelector('#submit').disabled=true;input.focus()}
  }
  function finish(ok,given,dg){done=true;const firstOk=ok&&tries===0,clean=firstOk&&hints===0;
    area.querySelectorAll('button,input,textarea').forEach(e=>e.disabled=true);hb.querySelectorAll('button').forEach(e=>e.disabled=true);
    if(Q.fig&&Q.figAfter&&mode!=='test')area.insertAdjacentHTML('beforeend',`<div class="fig">${Q.fig}</div>`);
    const res={ok:firstOk,clean,eventually:ok,hints,tag:Q.firstTag||(dg&&dg.tag)||null,given:Q.firstGiven||given,Q};
    if(!firstOk&&mode!=='probe')logError(Q,res,dg);
    let html='';
    if(mode==='test'){html=''}
    else if(mode==='probe'){html=ok?'<div class="fbx good"><strong>Correct.</strong></div>':'<div class="fbx bad"><strong>Not yet.</strong> <span>You’ll learn this today. No solution shown yet, so you can try it fresh in the lesson.</span></div>'}
    else if(ok){html=`<div class="fbx good"><strong>${tries?'Correct on the second try.':'Correct.'}</strong>${hints?`<span class="muted"> (${hints} hint${hints>1?'s':''} used, so this one doesn’t count toward mastery)</span>`:''}<details><summary>Compare with the worked steps</summary>${stepsHTML(Q.steps)}</details></div>`}
    else{html=`<div class="fbx bad"><strong>Here’s the correction.</strong>${res.tag&&res.tag!=='other'?`<span class="tag">${esc(TAGS[res.tag])}</span>`:''}<p>Correct answer: ${K(ansTex(Q))}</p>${stepsHTML(Q.steps)}${res.tag&&res.tag!=='other'&&TAGFIX[res.tag]?`<p class="fix"><b>Fix for next time:</b> ${esc(TAGFIX[res.tag])}</p>`:''}<p class="muted">This problem type will come back for review in 10 minutes, then tomorrow, then in 3 days.</p></div>`}
    fb.innerHTML=html;
    const next=()=>onDone(res);
    if(mode==='test'){next();return}
    if(mode!=='probe'){st.counter=(st.counter||0)+1;touchDate();save();if(st.counter%5===0)return explain(Q,next)}
    const nb=h('<button class="btn" id="next">Next →</button>');fb.appendChild(nb);nb.onclick=next;nb.focus({preventScroll:true});
  }
  function explain(Q,next){const w=Q.why||s.why;const box=h(`<div class="explain"><span class="eyebrow">Explain it · one sentence</span><p><b>${esc(w.q)}</b></p><textarea id="why" rows="2" placeholder="Because…"></textarea><div class="row"><button class="btn" id="whysub">Submit explanation</button></div><div class="whyfb"></div></div>`);
    fb.appendChild(box);const ta=box.querySelector('#why');ta.focus({preventScroll:true});
    box.querySelector('#whysub').onclick=()=>{const t=ta.value.trim();if(t.split(/\s+/).length<3){box.querySelector('.whyfb').innerHTML='<div class="note">Write a full sentence (at least a few words).</div>';return}
      const ok=w.keys.every(re=>re.test(t.toLowerCase()));st.explains.push({skill:Q.skill,q:w.q,a:t,ok,at:Date.now()});save();
      box.querySelector('#whysub').disabled=true;ta.disabled=true;
      box.querySelector('.whyfb').innerHTML=`<div class="fbx ${ok?'good':'warn'}"><strong>${ok?'You named the key idea.':'The key idea is missing or unclear.'}</strong><p>Model answer: ${esc(w.model)}</p></div>`;
      const nb=h('<button class="btn" id="next">Next →</button>');box.appendChild(nb);nb.onclick=next;nb.focus({preventScroll:true})}}
  build();
}
function logError(Q,res,dg){st.errors.push({at:Date.now(),day:SK[Q.skill].day,skill:Q.skill,text:Q.text,tex:Q.tex||'',given:String(res.given||'').slice(0,300),ans:ansTex(Q),tag:res.tag||'other',where:dg&&dg.stepLine!=null?`Line ${dg.stepLine+1}`:''});if(st.errors.length>600)st.errors=st.errors.slice(-600)}

function runSet(host,{title,intro,count,next,mode,noRef,onEnd}){
  let i=0;const results=[];
  const begin=()=>{NOREF=!!noRef;document.body.classList.toggle('noref',NOREF);step()};
  const step=()=>{if(i>=count){NOREF=false;document.body.classList.remove('noref');onEnd(results);return}
    let item;try{item=next(i,results)}catch(e){console.error(e);i++;return step()}
    const {Q,review}=item;Q.review=!!review;
    problem(Q,host,{mode,label:`${i+1} of ${count}`,onDone(res){results.push(res);if(review)reviewResult(review,res.ok);
      if(mode!=='test'&&mode!=='probe'){if(res.ok)st.skills[Q.skill]&&adapt(Q.skill,true);else adapt(Q.skill,false)}
      if(!res.ok&&mode!=='probe'&&!review)addReview(Q,mode==='check'&&title.startsWith('Exit')?nextDayStart()-Date.now():undefined);
      save();i++;step();host.scrollIntoView({block:'start',behavior:'smooth'})}})};
  host.innerHTML=`<div class="setintro"><h3>${title}</h3><p class="muted">${intro}</p><button class="btn" id="go">Start</button></div>`;host.querySelector('#go').onclick=begin;
}

[4,130,"Joint venture","A partnership set up for a specific project or a limited time.",""],
[4,130,"S corporation","A corporation taxed like a partnership (profits pass through to owners) while keeping limited liability; it has limits on number and type of shareholders.","LLC: similar pass-through, fewer restrictions."],
[4,131,"Limited liability company (LLC)","A form that combines a corporation's limited liability with partnership-style taxation, with fewer restrictions than an S corp.",""],
[4,131,"Cooperative (co-op)","An organization owned by its members that pools resources to serve their shared needs (e.g., farm or credit co-ops).",""],
[4,132,"Merger","Two companies combining to form one new company.","Acquisition: one company buys another."],
[4,132,"Acquisition","One company buying most of another company's stock, so the target becomes part of the buyer.",""],
[4,134,"Leveraged buyout (LBO)","Buying a company mostly with borrowed money, often using the target's own assets to secure the loans.",""],
// ---- Chapter 5
[5,145,"Entrepreneurship","The process of creating and managing a business to achieve desired objectives.","Entrepreneur = the person; entrepreneurship = the process."],
[5,146,"Microentrepreneurs","People who start small, often one-person businesses — frequently home-based or side ventures.",""],
[5,146,"Social entrepreneurs","People who use entrepreneurial skills to solve social problems, not mainly to earn profit.",""],
[5,146,"Small business","An independently owned and operated business that isn't dominant in its competitive area and has no more than 500 employees.",""],
[5,146,"Small Business Administration (SBA)","An independent federal agency that gives small businesses managerial and financial help.",""],
[5,151,"Sharing economy","An economic model based on sharing underused resources (a spare room, a car).","Gig economy: independent contractors selling services on demand."],
[5,151,"Gig economy","An economic model of independent contractors selling their services on demand.",""],
[5,154,"Undercapitalization","Not having enough money to run a business; a leading cause of small-business failure.",""],
[5,156,"Business plan","A detailed, written statement of the business idea, goals, market, operations, and financing.",""],
[5,157,"Venture capitalists","Investors who fund new or growing businesses in exchange for a share of ownership.",""],
[5,159,"Franchise","A license to sell another company's products or use its name in exchange for fees and royalties.",""],
[5,159,"Franchiser","The company that sells the franchise rights (e.g., the brand owner).","Franchisee: the buyer."],
[5,159,"Franchisee","The owner who buys and operates a franchise.",""],
[5,165,"Intrapreneurs","Employees inside a large organization who take responsibility for developing new ideas, like entrepreneurs do.",""],
// ---- Chapter 6
[6,178,"Management","A process for reaching an organization's objectives by using its resources effectively and efficiently in a changing environment.",""],
[6,178,"Managers","The people who make decisions about how to use the organization's resources to reach its objectives.",""],
[6,178,"Staffing","Hiring people to do the work, and keeping them through training and development.",""],
[6,178,"Downsizing","Eliminating many jobs to cut costs and become more efficient.",""],
[6,179,"Planning","Setting the organization's objectives and deciding how to reach them — the first management function.",""],
[6,180,"Mission","A statement of the organization's basic purpose and reason for existing.","Goals and objectives come out of the mission."],
[6,180,"Goals","Results the organization wants, stated in general terms without specific, quantifiable metrics.","Objectives: measurable benchmarks."],
[6,180,"Objectives","Measurable benchmarks that come from the organization's mission and goals.",""],
[6,181,"Key performance indicators (KPIs)","Measurable values that show how well the organization is reaching its objectives.",""],
[6,181,"Strategic plans","Plans that set long-range objectives and the overall strategy for fulfilling the mission; they generally cover one year or longer.",""],
[6,182,"Tactical plans","Short-range plans (usually one year or less) that carry out the activities and objectives in the strategic plan.",""],
[6,182,"Operational plans","Very short-term plans (a month, week, or even a day) that spell out what individuals, work groups, or departments must do to achieve the tactical plan.",""],
[6,182,"Crisis management (contingency planning)","Preparing ahead for how to handle emergencies and unexpected events.",""],
[6,183,"Organizing","Arranging resources and activities in a structure that lets the plan be carried out.",""],
[6,184,"Business model","How a firm creates, delivers, and is organized to operate and provide value to stakeholders.",""],
[6,184,"Directing","Motivating and leading employees to reach objectives.",""],
[6,184,"Controlling","Measuring performance against objectives and correcting course when results fall short.",""],
[6,185,"High-level managers","Top executives (CEO, CFO, COO) who set overall strategy and direction.",""],
[6,188,"Middle managers","Managers responsible for tactical and operational planning that carries out top management's general guidelines.",""],
[6,189,"Front-line managers","Supervisors who oversee workers and daily operations and are responsible for carrying out plans.",""],
[6,189,"Financial manager","Manages the organization's money: budgeting, cash flow, financing, investment.",""],
[6,189,"Production and operations manager","Turns resources into goods and services; oversees processes, scheduling, quality.",""],
[6,189,"Human resources manager","Handles hiring, training, pay, benefits, and employee relations.",""],
[6,189,"Marketing manager","Responsible for planning, pricing, promoting, and distributing products.",""],
[6,189,"Information technology (IT) manager","Manages the organization's computer systems, networks, and data.",""],
[6,189,"Administrative manager","A general manager who coordinates several areas rather than specializing in one.",""],
[6,190,"Technical expertise","The specialized knowledge and training to perform jobs in your area; most needed by front-line managers, least by top executives.",""],
[6,190,"Conceptual skills","The ability to think in abstract terms and see how parts fit together into the whole; needed by all managers, especially high-level ones.",""],
[6,190,"Analytical skills","The ability to identify problems, find their causes, and evaluate solutions.",""],
[6,190,"Human relations skills","The ability to deal with people, inside and outside the organization.",""],
[6,191,"Leadership","The ability to influence employees to work toward organizational goals.",""],
[6,191,"Autocratic leaders","Leaders who make all the decisions and then tell employees what to do and how to do it.","Democratic: employees involved in decisions."],
[6,191,"Democratic leaders","Leaders who involve employees in decisions; involved employees need less supervision.",""],
[6,191,"Free-rein leaders","Leaders who let employees work without much interference: the manager sets performance standards and employees find their own way to meet them.","Only works if employees know the standards."],
[6,193,"Authentic leaders","Leaders who are passionate about the company's mission, display its values, and form long-term relationships with stakeholders.",""],
[6,193,"Servant leaders","Leaders who consider the needs of their employees and form strong relationships with stakeholders.",""],
[6,193,"Employee empowerment","Giving employees the ability to take on responsibilities and make decisions about their work.",""],
[6,195,"Brainstorming","A technique where group members spontaneously suggest ideas to solve a problem.",""],
[6,197,"Agenda","A calendar or list of tasks and goals that guides a manager's day.",""],
[6,198,"Networking","Building relationships and sharing information with people who can help you reach your goals.",""],
// ---- Chapter 7
[7,209,"Organizational culture","The shared values, beliefs, and norms that shape how people in an organization behave.",""],
[7,211,"Structure","The arrangement or relationship of positions within an organization.",""],
[7,211,"Organizational chart","A visual display of the organization's structure, chain of command, and other relationships.",""],
[7,212,"Specialization","Dividing work into small, specific tasks that each worker does repeatedly (division of labor).",""],
[7,213,"Departmentalization","Grouping jobs into working units (departments).",""],
[7,213,"Functional departmentalization","Grouping jobs by the function performed: marketing, finance, operations, HR.",""],
[7,214,"Product departmentalization","Grouping jobs around the products made or sold (e.g., a beverage division and a snacks division).",""],
[7,215,"Geographical departmentalization","Grouping jobs by region or location (e.g., Northeast, West, Europe).",""],
[7,215,"Customer departmentalization","Grouping jobs around types of customers (e.g., retail, business, government).",""],
[7,216,"Delegation of authority","Assigning tasks to employees and giving them the power to make commitments, use resources, and take the actions needed to finish them.",""],
[7,216,"Responsibility","The obligation, placed on an employee, to perform an assigned task.","Accountability: answering for results."],
[7,216,"Accountability","The principle that employees given a task and authority must answer for — and accept the consequences of — the results.",""],
[7,217,"Centralized organization","An organization where authority stays at the top; few decisions are delegated down.","Decentralized: decisions pushed down to lower levels."],
[7,217,"Decentralized organization","An organization where decision-making authority is spread to lower levels.",""],
[7,218,"Span of management","The number of subordinates who report directly to one manager.","Wide span → flatter org; narrow span → taller org."],
[7,219,"Organizational structure","The levels of management in an organization.","Structure: how positions are arranged and related."],
[7,220,"Line structure","The simplest structure: a direct chain of command from top to bottom, with no specialist staff.",""],
[7,220,"Line-and-staff structure","A line chain of command plus staff specialists (legal, HR, accounting) who advise line managers.",""],
[7,220,"Restructure","To change an organization's basic structure.",""],
[7,220,"Multidivisional structure","A structure organized into semi-independent divisions (by product, region, or customer), each with its own departments.",""],
[7,221,"Matrix structure","A structure that overlays project teams on functional departments, so employees report to two bosses.",""],
[7,223,"Group","Two or more people who communicate and work together toward a common goal.","Team: members share accountability for one goal."],
[7,223,"Team","A small group whose members have complementary skills, a common purpose, and hold themselves jointly accountable.",""],
[7,224,"Committee","A permanent, formal group that handles recurring tasks.","Task force: temporary."],
[7,224,"Task force","A temporary group of employees responsible for bringing about a particular change.",""],
[7,224,"Project teams","Groups similar to task forces, but they run their own operation and have total control of a specific work project.",""],
[7,225,"Quality-assurance teams (quality circles)","Fairly small groups of workers from across the organization brought together to solve specific quality, productivity, or service problems.",""],
[7,225,"Self-directed team (SDT)","A group of employees responsible for an entire work process or segment that delivers a product to an internal or external customer.",""],
[7,227,"Grapevine","An informal channel of communication, separate from management's formal, official channels.",""]

const TERMS = T.map(t=>({id:termId(t),ch:t[0],p:t[1],term:t[2],def:t[3],vs:t[4]}));
Q.forEach((q,i)=>q.id="q"+i);
let S = {miss:{}, seen:{}, right:{}, exams:[]};   // miss[id]=count
let store = {kind:"none", ref:null, saving:false, pending:false};
const LSKEY="ch17-study-v1";
function lsLoad(){try{const v=localStorage.getItem(LSKEY);if(v)return JSON.parse(v)}catch(e){}return null}
function lsSave(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}
function merge(x){if(!x)return;S={miss:x.miss||{},seen:x.seen||{},right:x.right||{},exams:Array.isArray(x.exams)?x.exams.slice(-20):[]}}
merge(lsLoad());
let saveTimer=null;
function save(){lsSave();if(store.kind!=="db")return;clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
async function flush(){if(store.saving){store.pending=true;return}store.saving=true;
  try{await store.ref.set({miss:S.miss,seen:S.seen,right:S.right,exams:S.exams.slice(-20),updated:Date.now()})}catch(e){if(e&&e.code==="invalid_argument"){store.kind="local";render()}}
  store.saving=false;if(store.pending){store.pending=false;flush()}}
async function connect(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){store.kind="local";render();return}
    const id=await user.id(); if(!id){store.kind="local";render();return}
    store.ref=db.doc("data/users/"+id+"/progress");
    const snap=await store.ref.get();
    if(snap.exists){const d=snap.data(); // combine with any local progress
      const local=S; merge(d);
      for(const k in local.miss)S.miss[k]=Math.max(S.miss[k]||0,local.miss[k]);
      for(const k in local.seen)S.seen[k]=Math.max(S.seen[k]||0,local.seen[k]);
      for(const k in local.right)S.right[k]=Math.max(S.right[k]||0,local.right[k]);
      lsSave();
    }
    store.kind="db";render();
  }catch(e){store.kind="local";render()}
}
function mark(id,ok){S.seen[id]=(S.seen[id]||0)+1;
  if(ok){S.right[id]=(S.right[id]||0)+1; if(S.miss[id]){S.miss[id]=Math.max(0,S.miss[id]-1); if(!S.miss[id])delete S.miss[id];}}
  else S.miss[id]=(S.miss[id]||0)+1;
  save()}
const weakIds=()=>Object.keys(S.miss).filter(k=>S.miss[k]>0);

/* =========================================================
   QUESTION BUILDING
   ========================================================= */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function termQuestion(t){ // auto-built from the term bank, same-chapter distractors
  const fam=new Set();CONFUSE.forEach(g=>{if(g.includes(t.term))g.forEach(n=>fam.add(n))});
  const pool=shuffle(TERMS.filter(x=>x.ch===t.ch&&x.id!==t.id&&!fam.has(x.term)&&x.term.toLowerCase()!==t.term.toLowerCase()));
  const others=pool.slice(0,3);
  if(Math.random()<0.5){
    const opts=shuffle([t,...others]);
    return {id:t.id,kind:"term",ch:t.ch,p:t.p,s:`Which term matches this description? “${t.def}”`,o:opts.map(x=>x.term),a:opts.indexOf(t),e:`${t.term} (p. ${t.p}): ${t.def}${t.vs?" — "+t.vs:""}`,concept:t.term};
  } else {
    const opts=shuffle([t,...others]);
    return {id:t.id,kind:"term",ch:t.ch,p:t.p,s:`Which statement best describes ${t.term.toLowerCase().startsWith("the")?"":"“"}${t.term}${t.term.toLowerCase().startsWith("the")?"":"”"}?`,o:opts.map(x=>x.def),a:opts.indexOf(t),e:`${t.term} (p. ${t.p}): ${t.def}${t.vs?" — "+t.vs:""}`,concept:t.term};
  }
}
function appQuestion(q){const idx=shuffle(q.o.map((_,i)=>i));return {id:q.id,kind:"app",ch:q.ch,p:q.p,lo:q.lo,s:q.s,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),e:q.e,concept:"LO "+q.ch+"-"+q.lo+": "+(LOS[q.ch][q.lo-1]||"")}}
function itemById(id){if(id.startsWith("q"))return Q.find(q=>q.id===id);return TERMS.find(t=>t.id===id)}
function buildSet(chs,n,weightWeak){
  const apps=Q.filter(q=>chs.includes(q.ch)), terms=TERMS.filter(t=>chs.includes(t.ch));
  const weak=weightWeak?weakIds().filter(id=>{const it=itemById(id);return it&&chs.includes(it.ch)}):[];
  const out=[],used=new Set();
  // up to 40% from Weak Spots
  for(const id of shuffle(weak).slice(0,Math.ceil(n*0.4))){const it=itemById(id);out.push(id.startsWith("q")?appQuestion(it):termQuestion(it));used.add(id)}
  const nApp=Math.round((n-out.length)*0.55);
  for(const q of shuffle(apps).filter(q=>!used.has(q.id)).slice(0,nApp)){out.push(appQuestion(q));used.add(q.id)}
  for(const t of shuffle(terms).filter(t=>!used.has(t.id))){if(out.length>=n)break;out.push(termQuestion(t));used.add(t.id)}
  return shuffle(out).slice(0,n);
}

function saveNote(){return store.kind==="db"?"Progress saves to your account and follows you to other devices.":store.kind==="local"?"Progress saves in this browser only.":"Connecting progress storage…"}
function chChips(sel,key){return `<div class="chips" role="group" aria-label="Chapters">${Object.keys(CHAPTERS).map(c=>`<button class="chip" data-${key}="${c}" aria-pressed="${sel.includes(+c)}">Ch. ${c}</button>`).join("")}<button class="chip" data-${key}="all" aria-pressed="${sel.length===7}">All</button></div>`}

/* ---------- Flashcards ---------- */
function buildDeck(){const c=V.cards;let d=TERMS.filter(t=>c.chs.includes(t.ch));
  if(c.mode==="weak")d=d.filter(t=>S.miss[t.id]);
  c.deck=c.shuffle?shuffle(d):d; c.i=0; c.flip=false; c.got=0; c.missed=0}
function cards(){
  if(!V.cards){V.cards={chs:[1],mode:"all",shuffle:false};buildDeck()}
  const c=V.cards, t=c.deck[c.i];
  app.innerHTML=`<div class="stack">
    <div><h1>Flashcards</h1><p class="lede">Tap the card to flip. Rate yourself honestly — misses go to Weak Spots.</p></div>
    ${chChips(c.chs,"fch")}
    <div class="row"><div class="chips" role="group" aria-label="Deck">
      <button class="chip" data-mode="all" aria-pressed="${c.mode==="all"}">All terms</button>

    ${t?`<div class="progress">Card ${c.i+1} of ${c.deck.length} · Ch. ${t.ch} · ✓ ${c.got} · ✗ ${c.missed}</div>

      :`<span class="label">Ch. ${t.ch} · ${esc(CHAPTERS[t.ch])}</span><div class="term">${esc(t.term)}</div><div class="hint">Say the definition out loud, then tap to check.</div>`}
    </div></div>
    ${c.flip?`<div class="rate"><button class="btn miss" id="miss">Missed it</button><button class="btn got" id="got">Knew it</button></div>`:`<button class="btn ghost" id="flip">Flip</button>`}`
    :`<div class="panel"><p class="empty">${c.mode==="weak"?"No Weak Spots in these chapters. Nice.":"Deck finished."}</p><p>✓ ${c.got} knew · ✗ ${c.missed} missed</p><button class="btn" id="again">Start again</button></div>`}
  </div>`;
  wireChips("fch",c.chs,()=>{buildDeck();render()});

/* ---------- Practice quiz (instant feedback, hint + one retry) ---------- */
function startQuiz(){const z=V.quiz||(V.quiz={chs:[1]});
  let set;
  if(z.weakOnly){const ids=weakIds();set=shuffle(ids).slice(0,10).map(id=>{const it=itemById(id);return id.startsWith("q")?appQuestion(it):termQuestion(it)})}
  else set=buildSet(z.chs,10,true);
  Object.assign(z,{set,i:0,tries:0,sel:null,done:false,locked:false,score:0,firstTry:0,log:[]})}
function quiz(){
  if(!V.quiz||!V.quiz.set)startQuiz();
  const z=V.quiz, q=z.set[z.i];
  if(!z.set.length){app.innerHTML=`<div class="stack"><h1>Practice</h1><div class="panel"><p class="empty">No Weak Spots to drill yet.</p><button class="btn" id="back">Practice by chapter</button></div></div>`;$("#back").onclick=()=>{z.weakOnly=false;startQuiz();render()};return}
  if(!q||z.i>=z.set.length){
    app.innerHTML=`<div class="stack"><h1>Practice set done</h1>
     <div class="panel stack"><div><span class="label">First-try score</span><div class="score">${z.firstTry}/${z.set.length}</div></div>
     <div class="tblwrap"><table class="res"><thead><tr><th>#</th><th>Concept</th><th>Result</th><th>Review</th></tr></thead><tbody>
     ${z.log.map((l,i)=>`<tr><td class="n">${i+1}</td><td>${esc(l.concept)}</td><td class="${l.ok?"ok":"no"}">${l.ok?"Correct":l.retry?"Correct on retry":"Incorrect"}</td><td class="ref">Ch. ${l.ch}, p. ${l.p}</td></tr>`).join("")}</tbody></table></div>
     <div class="row"><button class="btn" id="again">New set</button><button class="btn ghost" id="toWeak">See Weak Spots</button></div></div></div>`;
    $("#again").onclick=()=>{z.weakOnly=false;startQuiz();render()};$("#toWeak").onclick=()=>go("weak");return}
  app.innerHTML=`<div class="stack">
   <div><h1>Practice</h1><p class="lede">10 questions, about 40% pulled from your Weak Spots. Miss once and you get a hint and one retry.</p></div>
   ${z.weakOnly?`<div class="row"><span class="tag">Weak Spots drill</span><button class="chip" id="exitWeak">Back to chapter sets</button></div>`:chChips(z.chs,"qch")}
   <div class="panel q">
     <div class="row" style="justify-content:space-between"><span class="progress">Question ${z.i+1} of ${z.set.length}</span><span class="ref">Ch. ${q.ch} · p. ${q.p}${q.kind==="app"?" · application":" · term"}</span></div>
     <div class="stem">${esc(q.s)}</div>
     <div class="opts">${q.o.map((o,i)=>{let cls="opt";if(z.locked){if(i===q.a)cls+=" right";else if(i===z.sel)cls+=" wrong"}else if(z.tries&&i===z.sel)cls+=" wrong";
       return `<button class="${cls}" data-o="${i}" ${z.locked||(z.tries&&i===z.sel)?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
     <div id="fb">${z.fb||""}</div>
     ${z.locked?`<div><button class="btn" id="nextQ">${z.i+1<z.set.length?"Next question":"See results"}</button></div>`:""}
   </div></div>`;
  if(!z.weakOnly)wireChips("qch",z.chs,()=>{startQuiz();render()});
  if($("#exitWeak"))$("#exitWeak").onclick=()=>{z.weakOnly=false;startQuiz();render()};
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const i=+b.dataset.o;z.sel=i;
    if(i===q.a){const first=z.tries===0;if(first)z.firstTry++;mark(q.id,first);
      z.log.push({concept:q.concept,ok:first,retry:!first,ch:q.ch,p:q.p});z.locked=true;
      z.fb=`<div class="fb good"><b>${first?"Correct.":"Correct on retry."}</b> ${esc(q.e)}</div>`}

    else{mark(q.id,false);z.log.push({concept:q.concept,ok:false,ch:q.ch,p:q.p});z.locked=true;
      z.fb=`<div class="fb bad"><b>Incorrect.</b> The answer is <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b>. ${esc(q.e)} <span class="ref">Review p. ${q.p}.</span></div>`}
    render()});
