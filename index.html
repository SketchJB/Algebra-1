}
function hintFor(q){
  if(q.kind==="term"){const t=TERMS.find(x=>x.id===q.id);return t&&t.vs?t.vs:`Re-read the key phrase in the question — it's a Ch. ${q.ch} term on p. ${q.p}.`}
  const lo=LOS[q.ch][q.lo-1];return `This tests “${lo}” (LO ${q.ch}-${q.lo}). Eliminate the options that belong to a different concept.`}

/* ---------- Calculations ---------- */
function newCalc(id){const g=id?CALC.find(c=>c.id===id):pick(CALC);return Object.assign({gid:g.id,topic:g.topic,ch:g.ch,p:g.p},g.gen())}
function calcCheck(val,prob){const v=parseFloat(String(val).replace(/[−–]/g,"-").replace(/[$,€¥%\s]/g,""));return !isNaN(v)&&Math.abs(v-prob.answer)<=prob.tol+1e-9}
function solutionHTML(p){return `<div class="solution"><div><span class="formula">${esc(p.formula)}</span> ${p.out?`<span class="tag out">OUTSIDE THE TEXT</span>`:`<span class="ref">concept p. ${p.p}</span>`}</div><ol>${p.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`}
function calc(){
  if(!V.calc)V.calc={sel:"any",prob:newCalc(),tries:0,done:false,fb:""};
  const c=V.calc,p=c.prob;
  app.innerHTML=`<div class="stack">
   <div><h1>Calculations</h1><p class="lede">Your exam has 3 calculation problems. Each one here gets new numbers. Work it out on paper, then enter just the number.</p></div>
   <div class="chips" role="group" aria-label="Problem type"><button class="chip" data-ct="any" aria-pressed="${c.sel==="any"}">Mixed</button>${CALC.map(g=>`<button class="chip" data-ct="${g.id}" aria-pressed="${c.sel===g.id}">${g.topic}</button>`).join("")}</div>
   <div class="panel q">
     <div class="row" style="justify-content:space-between"><span class="label">${esc(p.topic)}</span><span class="ref">Ch. ${p.ch} · p. ${p.p}</span></div>
     <div class="stem">${esc(p.stem)}</div>
     <form id="cf" class="row"><label class="label" for="cans">Answer (${p.unit})</label><input id="cans" class="num" inputmode="decimal" autocomplete="off" ${c.done?"disabled":""}><button class="btn" ${c.done?"disabled":""}>Check</button></form>
     <div>${c.fb}</div>
     <div class="row">${c.done?`<button class="btn" id="nextC">Next problem</button>`:`<button class="btn ghost" id="showC">Show solution</button>`}</div>
   </div></div>`;
  app.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{c.sel=b.dataset.ct;c.prob=newCalc(c.sel==="any"?null:c.sel);c.tries=0;c.done=false;c.fb="";render()});
  const cid="calc-"+p.gid;
  $("#cf").onsubmit=e=>{e.preventDefault();const v=$("#cans").value;if(!v.trim())return;
    if(calcCheck(v,p)){mark(cid,c.tries===0);c.done=true;c.fb=`<div class="fb good"><b>Correct${c.tries?" on retry":""}.</b>${solutionHTML(p)}</div>`}
    else if(c.tries===0){c.tries=1;c.fb=`<div class="fb hint"><b>Not quite (you entered ${esc(v)}).</b> Hint: ${esc(p.hint)} Try once more.</div>`}
    else{mark(cid,false);c.done=true;c.fb=`<div class="fb bad"><b>Incorrect — you entered ${esc(v)}.</b> Full solution:${solutionHTML(p)}</div>`}
    render()};
  $("#showC")&&($("#showC").onclick=()=>{mark(cid,false);c.done=true;c.fb=`<div class="fb bad"><b>Solution</b>${solutionHTML(p)}</div>`;render()});
  $("#nextC")&&($("#nextC").onclick=()=>{c.prob=newCalc(c.sel==="any"?null:c.sel);c.tries=0;c.done=false;c.fb="";render()});
}

/* ---------- Exam mode: 30 MC + 3 calc, graded at the end ---------- */
function startExam(){
  const mc=[];for(let ch=1;ch<=7;ch++)mc.push(...buildSet([ch],ch<=2?4:ch===7?5:4,false)); // ~4–5 per chapter
  let set=shuffle(mc).slice(0,30);
  const usedE=new Set(set.map(q=>q.id));
  for(const t of shuffle(TERMS)){if(set.length>=30)break;if(!usedE.has(t.id)){set.push(termQuestion(t));usedE.add(t.id)}}
  const types=shuffle(CALC).slice(0,3).map(g=>newCalc(g.id));
  V.exam={mc:set,calc:types,ans:{},cans:{},i:0,graded:false,start:Date.now()}}
function exam(){
  if(!V.exam){app.innerHTML=`<div class="stack"><div><h1>Exam mode</h1><p class="lede">30 multiple-choice questions spread across Ch. 1–7, then 3 calculation problems. No hints and no feedback until you submit.</p></div>
    <div class="panel stack"><div class="row"><span class="tag">30 MC</span><span class="tag">3 calculations</span><span class="tag">Graded at the end</span></div><div><button class="btn" id="go">Start exam</button></div></div></div>`;
    $("#go").onclick=()=>{startExam();render()};return}
  const x=V.exam; if(x.graded)return examResults();
  const N=x.mc.length+x.calc.length;
  const i=x.i;
  let body="";
  if(i<x.mc.length){const q=x.mc[i];
    body=`<div class="stem">${esc(q.s)}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt ${x.ans[i]===k?"sel":""}" data-o="${k}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
  else{const p=x.calc[i-x.mc.length];
    body=`<span class="label">Calculation · ${esc(p.topic)}</span><div class="stem">${esc(p.stem)}</div><div class="row"><label class="label" for="ex-c">Answer (${p.unit})</label><input id="ex-c" class="num" inputmode="decimal" autocomplete="off" value="${esc(x.cans[i]||"")}"></div>`}
  const answered=Object.keys(x.ans).length+Object.values(x.cans).filter(v=>String(v).trim()).length;
  app.innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><h1>Exam mode</h1><span class="progress">${answered}/${N} answered</span></div>
    <div class="panel q"><span class="progress">Question ${i+1} of ${N}</span>${body}
      <div class="row" style="justify-content:space-between"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>Previous</button>
      ${i<N-1?`<button class="btn" id="nxt">Next</button>`:`<button class="btn" id="submit">Submit exam</button>`}</div></div>
    <div id="confirm"></div>
    <div class="chips" aria-label="Jump to question">${Array.from({length:N},(_,k)=>{const done=k<x.mc.length?x.ans[k]!==undefined:String(x.cans[k]||"").trim();return `<button class="chip" data-j="${k}" aria-pressed="${k===i}" style="${done&&k!==i?"border-color:var(--accent)":""}">${k+1}</button>`}).join("")}</div>
  </div>`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{x.ans[i]=+b.dataset.o;render()});
  const keep=()=>{const el=$("#ex-c");if(el)x.cans[i]=el.value};
  $("#prev").onclick=()=>{keep();x.i--;render()};
  $("#nxt")&&($("#nxt").onclick=()=>{keep();x.i++;render()});
  app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{keep();x.i=+b.dataset.j;render()});
  $("#submit")&&($("#submit").onclick=()=>{keep();const left=N-(Object.keys(x.ans).length+Object.values(x.cans).filter(v=>String(v).trim()).length);
    if(left>0&&!x.confirming){x.confirming=true;$("#confirm").innerHTML=`<div class="fb hint">${left} question${left>1?"s are":" is"} unanswered and will be marked wrong. <button class="btn" id="sure" style="margin-left:8px">Submit anyway</button></div>`;$("#sure").onclick=grade;return}
    grade()});
  function grade(){x.graded=true;let right=0;
    x.mc.forEach((q,k)=>{const ok=x.ans[k]===q.a;if(ok)right++;mark(q.id,ok)});
    x.calc.forEach((p,k)=>{const ok=calcCheck(x.cans[x.mc.length+k]||"",p);if(ok)right++;mark("calc-"+p.gid,ok)});
    x.right=right;x.pct=Math.round(right/N*100);S.exams.push({d:Date.now(),pct:x.pct,r:right,n:N});save();render()}
}
function examResults(){
  const x=V.exam,N=x.mc.length+x.calc.length;
  const byCh={};x.mc.forEach((q,k)=>{const b=byCh[q.ch]||(byCh[q.ch]={r:0,n:0});b.n++;if(x.ans[k]===q.a)b.r++});
  const calcR=x.calc.filter((p,k)=>calcCheck(x.cans[x.mc.length+k]||"",p)).length;
  app.innerHTML=`<div class="stack">
   <h1>Exam results</h1>
   <div class="panel stack"><div class="row" style="gap:24px"><div><span class="label">Score</span><div class="score">${x.pct}%</div></div><div class="note">${x.right} of ${N} correct<br>MC ${x.right-calcR}/${x.mc.length} · Calculations ${calcR}/${x.calc.length}</div></div>
   <div class="tblwrap"><table class="res"><thead><tr><th>Chapter</th><th>Correct</th></tr></thead><tbody>${Object.keys(byCh).sort().map(c=>`<tr><td>Ch. ${c} · ${esc(CHAPTERS[c])}</td><td class="n ${byCh[c].r/byCh[c].n<0.7?"no":"ok"}">${byCh[c].r}/${byCh[c].n}</td></tr>`).join("")}</tbody></table></div>
   <div class="row"><button class="btn" id="newEx">New exam</button><button class="btn ghost" id="toWeak">Drill what I missed</button></div></div>
   <h2>Review</h2>
   ${x.mc.map((q,k)=>{const ok=x.ans[k]===q.a;return `<div class="panel q"><div class="row" style="justify-content:space-between"><span class="progress">Q${k+1} · <span class="${ok?"ok":"no"}">${ok?"Correct":"Incorrect"}</span></span><span class="ref">Ch. ${q.ch} · p. ${q.p}</span></div><div class="stem">${esc(q.s)}</div>
     ${ok?"":`<div class="note">You chose: ${x.ans[k]===undefined?"(blank)":esc(q.o[x.ans[k]])}</div>`}<div class="fb ${ok?"good":"bad"}"><b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b> — ${esc(q.e)}</div></div>`}).join("")}
   ${x.calc.map((p,k)=>{const v=x.cans[x.mc.length+k]||"";const ok=calcCheck(v,p);return `<div class="panel q"><div class="row" style="justify-content:space-between"><span class="progress">Q${x.mc.length+k+1} · Calculation · <span class="${ok?"ok":"no"}">${ok?"Correct":"Incorrect"}</span></span><span class="ref">Ch. ${p.ch} · p. ${p.p}</span></div><div class="stem">${esc(p.stem)}</div><div class="note">You entered: ${esc(v||"(blank)")}</div><div class="fb ${ok?"good":"bad"}">${solutionHTML(p)}</div></div>`}).join("")}
  </div>`;
  $("#newEx").onclick=()=>{startExam();render()};
  $("#toWeak").onclick=()=>{V.quiz={chs:[1,2,3,4,5,6,7],weakOnly:true};startQuiz();go("quiz")};
}

/* ---------- Weak Spots ---------- */
function weak(){
  const ids=weakIds().sort((a,b)=>S.miss[b]-S.miss[a]);
  const rows=ids.map(id=>{if(id.startsWith("calc-")){const g=CALC.find(c=>"calc-"+c.id===id);return g&&{id,ch:g.ch,p:g.p,name:"Calculation: "+g.topic,n:S.miss[id]}}
    const it=itemById(id);if(!it)return null;return {id,ch:it.ch,p:it.p,name:it.term||("LO "+it.ch+"-"+it.lo+" · "+(it.s.length>80?it.s.slice(0,78)+"…":it.s)),n:S.miss[id]}}).filter(Boolean);
  const byCh={};rows.forEach(r=>(byCh[r.ch]=byCh[r.ch]||[]).push(r));
  app.innerHTML=`<div class="stack">
   <div><h1>Weak Spots</h1><p class="lede">Every miss lands here. Each correct answer later removes one miss, so items clear as you master them.</p></div>
   <div class="row"><button class="btn" id="drill" ${rows.length?"":"disabled"}>Drill these now</button><button class="btn ghost" id="wcards" ${rows.some(r=>r.id.startsWith("t-"))?"":"disabled"}>Flashcards: Weak Spots</button><button class="btn ghost" id="copy">Copy status</button></div>
   <div id="copied"></div>
   ${rows.length?Object.keys(byCh).sort().map(c=>`<div class="panel weak"><h2 style="font-size:1rem">Ch. ${c} · ${esc(CHAPTERS[c])}</h2><ul>${byCh[c].map(r=>`<li><span>${esc(r.name)}</span><span class="ref">p. ${r.p} · missed ${r.n}×</span></li>`).join("")}</ul></div>`).join("")
     :`<div class="panel"><p class="empty">No Weak Spots yet. Take a practice set or an exam to start tracking.</p></div>`}
   <p class="note">${saveNote()}</p>
   <div class="panel stack"><span class="label">Reset</span><p class="note">Clears all Weak Spots, practice history, and exam scores.</p><div><button class="btn ghost" id="reset">Reset progress</button></div><div id="rconf"></div></div>
  </div>`;
  $("#drill").onclick=()=>{V.quiz={chs:[1,2,3,4,5,6,7],weakOnly:true};startQuiz();go("quiz")};
  $("#wcards").onclick=()=>{V.cards={chs:[1,2,3,4,5,6,7],mode:"weak",shuffle:true};buildDeck();go("cards")};
  $("#copy").onclick=()=>{const txt=statusText(rows);const done=()=>$("#copied").innerHTML=`<div class="fb good">Status copied. Paste it into a new chat.</div>`;
    try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt))}catch(e){fallbackCopy(txt)}};
  $("#reset").onclick=()=>{$("#rconf").innerHTML=`<div class="fb hint">This can't be undone. <button class="btn" id="rsure" style="margin-left:8px">Yes, reset</button></div>`;
    $("#rsure").onclick=()=>{S={miss:{},seen:{},right:{},exams:[]};save();if(store.kind==="db")flush();render()}};
}
function statusText(rows){const ex=S.exams.slice(-3).map(e=>e.pct+"%").join(", ")||"none";
  return `STATUS — Business Ch. 1–7\nItems practiced: ${Object.keys(S.seen).filter(k=>!k.startsWith("calc-")).length}/${TERMS.length+Q.length}\nRecent exam scores: ${ex}\nWEAK SPOTS:\n`+(rows.length?rows.map(r=>`- Ch.${r.ch} p.${r.p} ${r.name} (missed ${r.n}x)`).join("\n"):"- none")}
function fallbackCopy(txt){$("#copied").innerHTML=`<div class="fb hint">Select and copy:</div><textarea id="ctxt" rows="8" style="width:100%;font-family:var(--f-mono);font-size:.8rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">${esc(txt)}</textarea>`;const t=$("#ctxt");t.focus();t.select()}

/* ---------- boot ---------- */
(function(){const h=(location.hash||"").slice(1).replace(/^b-/,"");if(["home","sum","cards","quiz","calc","exam","weak"].includes(h))view=h;
  ROOT.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===view?"true":"false"));
  render();connect();
  window.addEventListener("hashchange",()=>{if(!location.hash.startsWith("#b-"))return;const h=location.hash.slice(3);if(["home","sum","cards","quiz","calc","exam","weak"].includes(h)&&h!==view)go(h)})})();

})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
